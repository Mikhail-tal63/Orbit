name: CI

on:
push:
branches:
  - main
  - auth
  - driver
  - vechile
   pull_request:
    branches:
      - main


job:
  test:
  runs_on: ubuntu-latest

  services:
   postgres:
   image: postgres:18
       env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432

           options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

           steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/orbit_test?sslmode=disable
        run: go test ./...